name: os-melhores-da-cidade

services:
  postgres:
    image: postgres:16-alpine
    container_name: os_melhores_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-os_melhores_da_cidade}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-os_melhores_da_cidade}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nestjs:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: os_melhores_nestjs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-os_melhores_da_cidade}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-super-secret-jwt-access-key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super-secret-jwt-refresh-key}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    ports:
      - "3333:3333"
    volumes:
      - uploads_data:/app/apps/api/uploads

  nextjs:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: os_melhores_nextjs
    restart: unless-stopped
    depends_on:
      - nestjs
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: os_melhores_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nextjs
      - nestjs

volumes:
  postgres_data:
  uploads_data:
